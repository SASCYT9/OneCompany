name: Atomic Price Sync

on:
  schedule:
    # Every 3 hours so Atomic retail changes reach the storefront the same day.
    # Shares the atomic-feed-sync group, so it queues behind the monthly full-feed sync.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview price changes without applying them"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: atomic-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Invoke Atomic price sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          url="https://onecompany.global/api/admin/cron/atomic-price-sync"
          if [ "$DRY_RUN" = "true" ]; then
            url="${url}?dryRun=1"
          fi
          curl --fail-with-body --show-error --silent \
            --retry 4 --retry-all-errors --max-time 600 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$url"
