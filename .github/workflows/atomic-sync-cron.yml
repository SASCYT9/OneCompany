name: Monthly Atomic Feed Sync

on:
  schedule:
    # Monthly on the 1st at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: monthly-atomic-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Invoke versioned Atomic Feed Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --max-time 600 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://onecompany.global/api/admin/cron/atomic-sync
