name: Monthly Turn14 Sync

on:
  schedule:
    # Runs at 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: monthly-turn14-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Invoke versioned Turn14 Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for brand in "Eventuri" "KW" "Radium Engineering" "AWE"; do
            encoded_brand="$(printf '%s' "$brand" | jq -sRr @uri)"
            curl --fail-with-body --show-error --silent \
              --retry 3 --retry-all-errors --max-time 600 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "https://onecompany.global/api/admin/cron/turn14-sync?brand=${encoded_brand}"
          done
